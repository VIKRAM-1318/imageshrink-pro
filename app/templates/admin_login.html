<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Private Administrator Access | ImageShrink Pro</title>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass { background: rgba(18, 18, 22, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="bg-[#09090B] text-zinc-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full glass rounded-3xl p-8 border border-zinc-800/80 shadow-2xl space-y-6 relative overflow-hidden">
    <!-- Top Security Glow -->
    <div class="absolute -top-24 -left-24 w-48 h-48 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-rose-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Header -->
    <div class="text-center space-y-2">
      <div class="w-12 h-12 mx-auto rounded-2xl bg-zinc-900 border border-zinc-800 flex items-center justify-center text-indigo-400 shadow-inner">
        <i data-lucide="shield-lock" class="w-6 h-6"></i>
      </div>
      <h1 class="text-xl font-bold tracking-tight text-white">Administrator Portal</h1>
      <p class="text-xs text-zinc-400">Restricted zone. Authorized personnel only.</p>
    </div>

    <!-- Alert / Error Box -->
    <div id="alert-box" class="hidden p-3.5 rounded-xl text-xs flex items-start gap-2.5 border">
      <i id="alert-icon" data-lucide="alert-circle" class="w-4 h-4 shrink-0 mt-0.5"></i>
      <div id="alert-message" class="flex-1 font-medium leading-relaxed"></div>
    </div>

    <!-- Login Form -->
    <form id="admin-login-form" onsubmit="handleAdminLogin(event)" class="space-y-4 text-xs">
      <div class="space-y-1.5">
        <label for="identifier" class="font-semibold text-zinc-300 block">Username or Email</label>
        <div class="relative">
          <i data-lucide="user" class="w-4 h-4 text-zinc-500 absolute left-3.5 top-3"></i>
          <input 
            type="text" 
            id="identifier" 
            name="identifier" 
            required 
            autocomplete="username"
            placeholder="admin@imageshrink.internal"
            class="w-full bg-zinc-950/80 border border-zinc-800 rounded-xl pl-10 pr-3.5 py-2.5 text-zinc-200 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition font-medium"
          />
        </div>
      </div>

      <div class="space-y-1.5">
        <label for="password" class="font-semibold text-zinc-300 block">Password</label>
        <div class="relative">
          <i data-lucide="key-round" class="w-4 h-4 text-zinc-500 absolute left-3.5 top-3"></i>
          <input 
            type="password" 
            id="password" 
            name="password" 
            required 
            autocomplete="current-password"
            placeholder="••••••••••••••••"
            class="w-full bg-zinc-950/80 border border-zinc-800 rounded-xl pl-10 pr-10 py-2.5 text-zinc-200 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition font-mono"
          />
          <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3.5 top-3 text-zinc-500 hover:text-zinc-300">
            <i id="pwd-eye-icon" data-lucide="eye" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <div class="p-3 bg-zinc-950/40 rounded-xl border border-zinc-900 text-[11px] text-zinc-500 leading-normal flex items-start gap-2">
        <i data-lucide="info" class="w-3.5 h-3.5 text-zinc-400 shrink-0 mt-0.5"></i>
        <span>Session protected with HTTP-only cookies, temporary lockout on repeated failures, and tamper-evident audit logs.</span>
      </div>

      <button 
        type="submit" 
        id="btn-login-submit"
        class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] text-white font-semibold shadow-lg shadow-indigo-600/25 transition duration-150 flex items-center justify-center gap-2"
      >
        <i data-lucide="lock" class="w-4 h-4"></i>
        <span>Authenticate Session</span>
      </button>
    </form>

    <!-- Footer Note -->
    <div class="text-center pt-2 border-t border-zinc-800/60">
      <p class="text-[10px] text-zinc-600 font-mono tracking-wider">SECURE AUDIT ENABLED • IP LOGGED</p>
    </div>
  </div>

  <script>
    lucide.createIcons();

    function togglePasswordVisibility() {
      const input = document.getElementById('password');
      const icon = document.getElementById('pwd-eye-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        input.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }

    function showAlert(msg, isError = true) {
      const box = document.getElementById('alert-box');
      const text = document.getElementById('alert-message');
      const icon = document.getElementById('alert-icon');

      box.classList.remove('hidden', 'bg-rose-500/10', 'border-rose-500/20', 'text-rose-400', 'bg-emerald-500/10', 'border-emerald-500/20', 'text-emerald-400');
      if (isError) {
        box.classList.add('bg-rose-500/10', 'border-rose-500/20', 'text-rose-400');
        icon.setAttribute('data-lucide', 'alert-triangle');
      } else {
        box.classList.add('bg-emerald-500/10', 'border-emerald-500/20', 'text-emerald-400');
        icon.setAttribute('data-lucide', 'check-circle-2');
      }
      text.textContent = msg;
      lucide.createIcons();
    }

    async function handleAdminLogin(event) {
      event.preventDefault();
      const identifier = document.getElementById('identifier').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btn-login-submit');

      if (!identifier || !password) {
        showAlert('Please provide both username and password.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i data-lucide="loader" class="w-4 h-4 animate-spin"></i> Verifying Credentials...';
      lucide.createIcons();

      const formData = new FormData();
      formData.append('identifier', identifier);
      formData.append('password', password);

      try {
        const resp = await fetch('/admin/login', {
          method: 'POST',
          body: formData,
        });

        const data = await resp.json();

        if (resp.ok && data.success) {
          showAlert('Authentication confirmed. Entering secure dashboard...', false);
          setTimeout(() => {
            window.location.href = data.redirect_url || '/admin';
          }, 400);
        } else {
          showAlert(data.message || 'Authentication failed. Check your credentials.');
          btn.disabled = false;
          btn.innerHTML = '<i data-lucide="lock" class="w-4 h-4"></i> <span>Authenticate Session</span>';
          lucide.createIcons();
        }
      } catch (err) {
        showAlert('Connection error. Server is unreachable or offline.');
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="lock" class="w-4 h-4"></i> <span>Authenticate Session</span>';
        lucide.createIcons();
      }
    }
  </script>
</body>
</html>
